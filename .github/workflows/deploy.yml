name: Publicar en GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pages: read
    outputs:
      current: ${{ steps.revision.outputs.current }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Descargar código validado
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Omitir revisiones que ya no sean main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          candidate_sha=$(git rev-parse HEAD)
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          if [ "$candidate_sha" = "$current_sha" ]; then
            ci_conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${candidate_sha}&event=push&per_page=100" --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.run_number) | last | .conclusion')
            if [ "$ci_conclusion" != "success" ]; then
              echo "::error::La última CI de este commit debe terminar correctamente antes de publicar."
              exit 1
            fi
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Se omite una revisión sustituida en main."
          fi
      - name: Configurar Node.js
        if: steps.revision.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        if: steps.revision.outputs.current == 'true'
        run: npm ci
      - name: Comprobar calidad y privacidad
        if: steps.revision.outputs.current == 'true'
        run: npm run check
      - name: Consultar configuración de Pages
        if: steps.revision.outputs.current == 'true'
        id: pages
        uses: actions/configure-pages@v6
      - name: Construir sitio
        if: steps.revision.outputs.current == 'true'
        run: npm run build
        env:
          ATLAS_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Subir únicamente el sitio estático
        if: steps.revision.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    if: needs.build.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Confirmar que la revisión sigue en main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.build.outputs.sha }}
        run: |
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$CANDIDATE_SHA" = "$current_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Se omite una revisión sustituida durante el build."
          fi
      - name: Publicar
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
